name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Allow only repository owner
        run: |
          if [ "${{ github.actor }}" != "robbirob" ]; then
            echo "Only robbirob may run this release workflow. Current actor: ${{ github.actor }}"
            exit 1
          fi

  release:
    needs: authorize
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit and next snapshot
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"

          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "pom.xml version must end with -SNAPSHOT, got: $CURRENT_VERSION"
            exit 1
          fi

          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          TAG="v${RELEASE_VERSION}"

          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

          echo "Preparing release ${RELEASE_VERSION} from ${CURRENT_VERSION}"

          mvn -B -ntp versions:set -DnewVersion="${RELEASE_VERSION}" -DgenerateBackupPoms=false
          mvn -B -ntp clean verify

          git add pom.xml
          git commit -m "Release ${RELEASE_VERSION} [skip ci]"
          git tag -a "${TAG}" -m "Release ${RELEASE_VERSION}"

          NEXT_VERSION="$(RELEASE_VERSION="${RELEASE_VERSION}" python3 -c 'import os; version = os.environ["RELEASE_VERSION"]; parts = version.split("."); assert parts and parts[-1].isdigit(), f"Cannot auto-increment release version: {version}"; parts[-1] = str(int(parts[-1]) + 1); print(".".join(parts) + "-SNAPSHOT")')"

          mvn -B -ntp versions:set -DnewVersion="${NEXT_VERSION}" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "Prepare next development version ${NEXT_VERSION} [skip ci]"

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Push release tag and version commits
        run: |
          git push origin HEAD:development
          git push origin "${{ steps.prepare.outputs.tag }}"
