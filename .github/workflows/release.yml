name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    if: github.actor == 'robbirob'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate release tag matches pom.xml
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${TAG#v}"
          POM_VERSION="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"

          if [[ "${TAG}" != v* ]]; then
            echo "Release tag must start with v, got: ${TAG}"
            exit 1
          fi

          if [[ "${POM_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "Tag ${TAG} does not match pom.xml version ${POM_VERSION}"
            exit 1
          fi

          if [[ "${POM_VERSION}" == *-SNAPSHOT ]]; then
            echo "Refusing to release a SNAPSHOT version: ${POM_VERSION}"
            exit 1
          fi

      - name: Build release artifacts
        run: mvn -B -ntp clean package

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/rest-in-peace-*.jar
          generate_release_notes: true
